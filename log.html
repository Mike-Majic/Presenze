<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log Presenze</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>LOG PRESENZE</header>

  <div class="container">
    <div class="card">
      <div class="topbar">
        <div class="pill" id="logUserInfo">Utente: -</div>
        <div class="pill" id="logRoleInfo">Ruolo: -</div>
        <div class="actions topbar-actions">
          <button type="button" class="btn-blue" id="btnBackDashboard">Torna alla dashboard</button>
          <button type="button" class="btn-red" id="btnLogoutLog">Logout</button>
        </div>
      </div>

      <div id="logStatus" class="status"></div>

      <div class="table-wrap" style="margin-top:16px;">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Data</th>
              <th>Stato</th>
              <th>Ore</th>
              <th>Ore extra</th>
              <th>Sede</th>
              <th>Note</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="logTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="log.js"></script>
</body>
</html>
