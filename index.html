<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Presenze V5</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>GESTIONE PRESENZE LAVORO</header>

  <div class="container">

    <div id="loginBox" class="card login-wrap">
      <h2>Accesso</h2>

      <div class="grid">
        <div id="registerFields" class="hidden">
          <div class="grid">
            <div>
              <label>Nome</label>
              <input id="nomeRegister" type="text" placeholder="Nome dipendente" autocomplete="given-name">
            </div>

            <div>
              <label>Cognome</label>
              <input id="cognomeRegister" type="text" placeholder="Cognome dipendente" autocomplete="family-name">
            </div>
          </div>
        </div>

        <div>
          <label>Email</label>
          <input id="email" type="email" placeholder="nome@email.it" autocomplete="email" inputmode="email">
        </div>

        <div>
          <label>Password</label>
          <input id="password" type="password" placeholder="Password" autocomplete="current-password">
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn-green" id="btnLogin">Login</button>
        <button type="button" class="btn-orange" id="btnRegisterMode">Compila registrazione</button>
        <button type="button" class="btn-orange hidden" id="btnRegister">Conferma registrazione</button>
        <button type="button" class="btn-gray hidden" id="btnCancelRegister">Annulla registrazione</button>
        <button type="button" class="btn-blue" id="btnResetPassword">Reset password</button>
      </div>

      <div id="authStatus" class="status"></div>
    </div>

    <div id="app" class="hidden">

      <div class="topbar">
        <div class="pill" id="userInfo">Dipendente: -</div>
        <div class="pill" id="roleInfo">Ruolo: -</div>
        <div class="actions topbar-actions">
          <button type="button" class="btn-orange hidden" id="btnManageUsers">Gestione utenti</button>
          <button type="button" class="btn-red" id="btnLogout">Logout</button>
        </div>
      </div>

      <div class="card">
        <h3 id="formTitle">Inserisci presenza</h3>

        <div class="form-grid">
          <div>
            <label>Nome</label>
            <input id="nome" placeholder="Nome dipendente" readonly>
          </div>

          <div>
            <label>Data</label>
            <input id="data" type="date">
          </div>

          <div>
            <label>Stato</label>
            <select id="stato">
              <option value="Presente">Presente</option>
              <option value="Ferie">Ferie</option>
              <option value="Permesso">Permesso</option>
              <option value="Malattia">Malattia</option>
              <option value="Lutto">Lutto</option>
              <option value="Maternità">Maternità</option>
              <option value="104">104</option>
            </select>
          </div>

          <div>
            <label>Ore</label>
            <input id="ore" type="number" step="0.5" min="0" placeholder="0">
          </div>

          <div>
            <label>Sede</label>
            <select id="sede">
              <option value="Sielte Pomezia">Sielte Pomezia</option>
              <option value="Sielte Spinaceto">Sielte Spinaceto</option>
              <option value="Altro">Altro</option>
            </select>
          </div>

          <div>
            <label>Note</label>
            <input id="note" placeholder="Note">
          </div>
        </div>

        <div class="actions">
          <button type="button" id="saveBtn" class="btn-green">Salva presenza</button>
          <button type="button" id="cancelEditBtn" class="btn-gray hidden">Annulla modifica</button>
        </div>

        <div id="appStatus" class="status"></div>
      </div>

      <div class="card">
        <h3>Filtri e riepilogo</h3>

        <div class="form-grid">
          <div>
            <label>Mese</label>
            <input id="filterMonth" type="month">
          </div>

          <div>
            <label>Stato</label>
            <select id="filterState">
              <option value="">Tutti</option>
              <option value="Presente">Presente</option>
              <option value="Ferie">Ferie</option>
              <option value="Permesso">Permesso</option>
              <option value="Malattia">Malattia</option>
              <option value="Lutto">Lutto</option>
              <option value="Maternità">Maternità</option>
              <option value="104">104</option>
            </select>
          </div>

          <div>
            <label>Cerca nome</label>
            <input id="filterName" placeholder="Scrivi un nome">
          </div>

          <div id="adminFilterWrap" class="hidden">
            <label>Dipendente</label>
            <select id="filterEmployee">
              <option value="">Tutti</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn-blue" id="btnResetFilters">Reset filtri</button>
          <button type="button" class="btn-blue" id="btnExportCsv">Export CSV</button>
        </div>

        <div class="summary-grid">
          <div class="summary-box">
            <div class="summary-label">Totale record</div>
            <div class="summary-value" id="sumRecord">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Totale ore</div>
            <div class="summary-value" id="sumOre">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Presenti</div>
            <div class="summary-value" id="sumPresenti">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Ferie</div>
            <div class="summary-value" id="sumFerie">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Permessi</div>
            <div class="summary-value" id="sumPermessi">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Malattia</div>
            <div class="summary-value" id="sumMalattia">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Lutto</div>
            <div class="summary-value" id="sumLutto">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">Maternità</div>
            <div class="summary-value" id="sumMaternita">0</div>
          </div>

          <div class="summary-box">
            <div class="summary-label">104</div>
            <div class="summary-value" id="sum104">0</div>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Presenze</h3>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nome</th>
                <th>Data</th>
                <th>Stato</th>
                <th>Ore</th>
                <th>Sede</th>
                <th>Note</th>
                <th>Azioni</th>
              </tr>
            </thead>
            <tbody id="tabella"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
