<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Presenze</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

:root{
--bg1:#0f172a;
--bg2:#111827;
--card:#1e293b;
--card2:#334155;
--text:#ffffff;
--muted:#cbd5e1;
--orange:#f97316;
--green:#22c55e;
--red:#ef4444;
--blue:#38bdf8;
--pink:#ec4899;
--yellow:#facc15;
--border:rgba(255,255,255,.08);
}

body{
margin:0;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top left, rgba(249,115,22,.20), transparent 25%),
radial-gradient(circle at top right, rgba(56,189,248,.20), transparent 25%),
linear-gradient(135deg,var(--bg1),var(--bg2));
color:var(--text);
min-height:100vh;
}

header{
padding:24px 18px;
text-align:center;
font-size:28px;
font-weight:800;
letter-spacing:.5px;
background:linear-gradient(90deg,var(--orange),var(--pink),var(--blue),var(--green));
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.container{
max-width:1100px;
margin:0 auto;
padding:20px;
}

.card{
background:rgba(30,41,59,.92);
border:1px solid var(--border);
border-radius:18px;
padding:18px;
margin-bottom:18px;
box-shadow:0 10px 24px rgba(0,0,0,.20);
}

h2,h3{
margin-top:0;
margin-bottom:14px;
}

label{
display:block;
font-size:13px;
color:var(--muted);
margin-bottom:6px;
}

input,select,button{
width:100%;
border:none;
border-radius:12px;
padding:12px 14px;
font-size:14px;
font-family:inherit;
}

input,select{
background:var(--card2);
color:var(--text);
outline:none;
border:1px solid rgba(255,255,255,.05);
}

input::placeholder{
color:#b6c2d1;
}

button{
cursor:pointer;
font-weight:700;
transition:.18s ease;
color:#fff;
}

button:hover{
transform:translateY(-1px);
filter:brightness(1.03);
}

.btn-primary{ background:linear-gradient(90deg,var(--green),#16a34a); }
.btn-secondary{ background:linear-gradient(90deg,var(--orange),#ea580c); }
.btn-danger{ background:linear-gradient(90deg,var(--red),#dc2626); }

.grid{
display:grid;
gap:12px;
}

.login-wrap{
max-width:460px;
margin:50px auto 0 auto;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:12px;
}

.actions > button{
flex:1 1 180px;
}

.hidden{
display:none !important;
}

.status{
margin-top:10px;
font-size:14px;
color:var(--muted);
min-height:20px;
white-space:pre-wrap;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
flex-wrap:wrap;
margin-bottom:18px;
}

.pill{
padding:10px 14px;
border-radius:999px;
background:#0b1220;
border:1px solid var(--border);
color:var(--muted);
font-size:14px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
}

.table-wrap{
overflow:auto;
border-radius:14px;
margin-top:16px;
}

table{
width:100%;
border-collapse:collapse;
min-width:760px;
}

th{
background:linear-gradient(90deg,var(--orange),#fb7185);
padding:12px;
font-size:14px;
text-align:center;
white-space:nowrap;
}

td{
background:rgba(51,65,85,.9);
padding:12px;
text-align:center;
border-top:1px solid rgba(255,255,255,.06);
font-size:14px;
}

.empty{
padding:18px;
text-align:center;
color:var(--muted);
}
</style>
</head>
<body>

<header>GESTIONE PRESENZE LAVORO</header>

<div class="container">

<div id="loginBox" class="card login-wrap">
<h2>Accesso</h2>

<div class="grid">
<div>
<label>Email</label>
<input id="email" type="email" placeholder="nome@email.it">
</div>

<div>
<label>Password</label>
<input id="password" type="password" placeholder="Password">
</div>
</div>

<div class="actions">
<button class="btn-primary" onclick="login()">Login</button>
<button class="btn-secondary" onclick="register()">Registrati</button>
</div>

<div id="authStatus" class="status"></div>
</div>

<div id="app" class="hidden">

<div class="topbar">
<div class="pill" id="userInfo">Utente: -</div>
<div class="actions" style="max-width:220px; width:100%;">
<button class="btn-danger" onclick="logout()">Logout</button>
</div>
</div>

<div class="card">
<h3>Inserisci presenza</h3>

<div class="form-grid">
<div>
<label>Nome</label>
<input id="nome" placeholder="Nome dipendente">
</div>

<div>
<label>Data</label>
<input id="data" type="date">
</div>

<div>
<label>Stato</label>
<select id="stato">
<option value="Presente">Presente</option>
<option value="Assente">Assente</option>
<option value="Ferie">Ferie</option>
<option value="Permesso">Permesso</option>
</select>
</div>

<div>
<label>Ore</label>
<input id="ore" type="number" step="0.5" min="0" placeholder="0">
</div>

<div>
<label>Sede</label>
<input id="sede" placeholder="Sede / Cantiere">
</div>

<div>
<label>Note</label>
<input id="note" placeholder="Note">
</div>
</div>

<div class="actions">
<button class="btn-primary" onclick="addPresenza()">Salva presenza</button>
</div>

<div id="appStatus" class="status"></div>
</div>

<div class="card">
<h3>Presenze</h3>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>Nome</th>
<th>Data</th>
<th>Stato</th>
<th>Ore</th>
<th>Sede</th>
<th>Note</th>
</tr>
</thead>
<tbody id="tabella"></tbody>
</table>
</div>
</div>

</div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://nzmgjuwmrvjxpykzawkp.supabase.co"
const SUPABASE_KEY = "sb_publishable_lwd5Lahd5CirK_RlQmhcBA_PTo6c14v"

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let user = null

function qs(id){
  return document.getElementById(id)
}

function setAuthStatus(msg){
  const el = qs("authStatus")
  if(el) el.textContent = msg || ""
  console.log("[AUTH]", msg || "")
}

function setAppStatus(msg){
  const el = qs("appStatus")
  if(el) el.textContent = msg || ""
  console.log("[APP]", msg || "")
}

function escapeHtml(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;")
}

function todayISO(){
  const d = new Date()
  const year = d.getFullYear()
  const month = String(d.getMonth() + 1).padStart(2,"0")
  const day = String(d.getDate()).padStart(2,"0")
  return `${year}-${month}-${day}`
}

function showLogin(){
  user = null
  qs("app").classList.add("hidden")
  qs("loginBox").classList.remove("hidden")
  qs("userInfo").textContent = "Utente: -"
  qs("tabella").innerHTML = ""
}

function showApp(currentUser){
  user = currentUser
  qs("loginBox").classList.add("hidden")
  qs("app").classList.remove("hidden")
  qs("userInfo").textContent = `Utente: ${user.email || "-"}`
  qs("data").value = todayISO()
  loadPresenze()
}

async function checkSession(){
  const { data, error } = await supabase.auth.getSession()

  if(error){
    setAuthStatus("Errore sessione: " + error.message)
    showLogin()
    return
  }

  const currentUser = data?.session?.user || null

  if(currentUser){
    showApp(currentUser)
    setAuthStatus("")
  }else{
    showLogin()
  }
}

async function login(){
  try{
    const email = qs("email").value.trim()
    const password = qs("password").value.trim()

    setAuthStatus("Tentativo di login...")

    if(!email || !password){
      setAuthStatus("Inserisci email e password")
      return
    }

    const { data, error } = await supabase.auth.signInWithPassword({
      email,
      password
    })

    if(error){
      setAuthStatus("Errore login: " + error.message)
      return
    }

    if(!data?.user){
      setAuthStatus("Login non riuscito")
      return
    }

    showApp(data.user)
    setAuthStatus("Login riuscito")
  }catch(err){
    setAuthStatus("Errore JS login: " + err.message)
  }
}

async function register(){
  try{
    const email = qs("email").value.trim()
    const password = qs("password").value.trim()

    setAuthStatus("Tentativo di registrazione...")

    if(!email || !password){
      setAuthStatus("Inserisci email e password")
      return
    }

    if(password.length < 6){
      setAuthStatus("La password deve avere almeno 6 caratteri")
      return
    }

    const { data, error } = await supabase.auth.signUp({
      email,
      password
    })

    if(error){
      setAuthStatus("Errore registrazione: " + error.message)
      return
    }

    if(data?.session?.user){
      showApp(data.session.user)
      setAuthStatus("Registrazione completata e login effettuato")
      return
    }

    setAuthStatus("Utente creato. Se non entri subito, disattiva la conferma email in Supabase.")
  }catch(err){
    setAuthStatus("Errore JS registrazione: " + err.message)
  }
}

async function logout(){
  await supabase.auth.signOut()
  showLogin()
  setAuthStatus("Logout effettuato")
}

async function addPresenza(){
  try{
    setAppStatus("")

    if(!user){
      setAppStatus("Devi fare login")
      return
    }

    const nome = qs("nome").value.trim()
    const data = qs("data").value
    const stato = qs("stato").value
    const ore = Number(qs("ore").value || 0)
    const sede = qs("sede").value.trim()
    const note = qs("note").value.trim()

    if(!nome || !data){
      setAppStatus("Compila almeno nome e data")
      return
    }

    const { error } = await supabase
      .from("presenze")
      .insert([{
        user_id: user.id,
        email: user.email,
        nome,
        data,
        stato,
        ore,
        sede,
        note
      }])

    if(error){
      setAppStatus("Errore inserimento: " + error.message)
      return
    }

    qs("nome").value = ""
    qs("data").value = todayISO()
    qs("stato").value = "Presente"
    qs("ore").value = ""
    qs("sede").value = ""
    qs("note").value = ""

    setAppStatus("Presenza salvata")
    loadPresenze()
  }catch(err){
    setAppStatus("Errore JS salvataggio: " + err.message)
  }
}

async function loadPresenze(){
  if(!user) return

  const { data, error } = await supabase
    .from("presenze")
    .select("*")
    .order("data", { ascending: false })
    .order("id", { ascending: false })

  const tabella = qs("tabella")
  tabella.innerHTML = ""

  if(error){
    tabella.innerHTML = `<tr><td colspan="6" class="empty">Errore caricamento: ${escapeHtml(error.message)}</td></tr>`
    return
  }

  if(!data || !data.length){
    tabella.innerHTML = `<tr><td colspan="6" class="empty">Nessuna presenza trovata</td></tr>`
    return
  }

  data.forEach(r => {
    tabella.innerHTML += `
      <tr>
        <td>${escapeHtml(r.nome || "")}</td>
        <td>${escapeHtml(r.data || "")}</td>
        <td>${escapeHtml(r.stato || "")}</td>
        <td>${escapeHtml(r.ore || 0)}</td>
        <td>${escapeHtml(r.sede || "")}</td>
        <td>${escapeHtml(r.note || "")}</td>
      </tr>
    `
  })
}

window.addEventListener("error", function(event){
  setAuthStatus("Errore JavaScript: " + event.message)
})

supabase.auth.onAuthStateChange((_event, session) => {
  if(session?.user){
    showApp(session.user)
  }else{
    showLogin()
  }
})

checkSession()
</script>

</body>
</html>
