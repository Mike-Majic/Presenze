<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<title>Gestione Presenze</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

header{
background:#f97316;
padding:20px;
font-size:24px;
font-weight:bold;
text-align:center;
}

.container{
max-width:1100px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

input,select,button{
padding:10px;
border:none;
border-radius:6px;
margin:5px;
}

input,select{
background:#334155;
color:white;
}

button{
background:#22c55e;
color:white;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#f97316;
padding:10px;
}

td{
background:#334155;
padding:10px;
text-align:center;
}

.loginBox{
max-width:400px;
margin:auto;
margin-top:80px;
}

.hidden{
display:none;
}

</style>

</head>

<body>

<header>
GESTIONE PRESENZE LAVORO
</header>

<div class="container">

<div id="loginBox" class="card loginBox">

<h2>Login</h2>

<input id="email" placeholder="email">
<br>

<input id="password" type="password" placeholder="password">
<br>

<button onclick="login()">Login</button>
<button onclick="register()">Registrati</button>

</div>


<div id="app" class="hidden">

<div class="card">

<h3>Inserisci Presenza</h3>

<input id="nome" placeholder="nome">

<input id="data" type="date">

<select id="stato">
<option>Presente</option>
<option>Assente</option>
<option>Ferie</option>
<option>Permesso</option>
</select>

<input id="ore" type="number" placeholder="ore">

<input id="sede" placeholder="sede">

<input id="note" placeholder="note">

<button onclick="addPresenza()">Salva</button>

</div>


<div class="card">

<h3>Presenze</h3>

<table>

<thead>

<tr>
<th>Nome</th>
<th>Data</th>
<th>Stato</th>
<th>Ore</th>
<th>Sede</th>
<th>Note</th>
</tr>

</thead>

<tbody id="tabella">

</tbody>

</table>

</div>

</div>

</div>


<script>

const SUPABASE_URL = "https://nzmgjuwmrvjxpykzawkp.supabase.co"

const SUPABASE_KEY = "sb_publishable_lwd5Lahd5CirK_RlQmhcBA_PTo6c14v"

const supabase = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)

let user = null



async function login(){

const email = document.getElementById("email").value
const password = document.getElementById("password").value

const { data,error } = await supabase.auth.signInWithPassword({
email:email,
password:password
})

if(error){

alert("errore login")

}else{

user=data.user

document.getElementById("loginBox").classList.add("hidden")

document.getElementById("app").classList.remove("hidden")

loadPresenze()

}

}



async function register(){

const email = document.getElementById("email").value
const password = document.getElementById("password").value

const { error } = await supabase.auth.signUp({
email:email,
password:password
})

if(error){

alert("errore registrazione")

}else{

alert("utente creato")

}

}



async function addPresenza(){

const nome=document.getElementById("nome").value
const data=document.getElementById("data").value
const stato=document.getElementById("stato").value
const ore=document.getElementById("ore").value
const sede=document.getElementById("sede").value
const note=document.getElementById("note").value

const { error } = await supabase

.from("presenze")

.insert([{

user_id:user.id,
email:user.email,
nome:nome,
data:data,
stato:stato,
ore:ore,
sede:sede,
note:note

}])

if(error){

alert("errore inserimento")

}else{

loadPresenze()

}

}



async function loadPresenze(){

const { data,error } = await supabase

.from("presenze")

.select("*")

.order("data",{ascending:false})

if(error) return

const tabella = document.getElementById("tabella")

tabella.innerHTML=""

data.forEach(r=>{

tabella.innerHTML+=`

<tr>

<td>${r.nome}</td>

<td>${r.data}</td>

<td>${r.stato}</td>

<td>${r.ore}</td>

<td>${r.sede}</td>

<td>${r.note}</td>

</tr>

`

})

}

</script>

</body>

</html>
