<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestione Presenze</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
color:#fff;
margin:0;
padding:0;
min-height:100vh;
}

header{
background:linear-gradient(90deg,#f97316,#fb7185,#22c55e);
padding:22px;
font-size:28px;
font-weight:bold;
text-align:center;
letter-spacing:1px;
box-shadow:0 4px 20px rgba(0,0,0,.25);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{
background:rgba(30,41,59,.95);
padding:20px;
border-radius:16px;
margin-bottom:20px;
box-shadow:0 8px 24px rgba(0,0,0,.25);
border:1px solid rgba(255,255,255,.08);
}

h2,h3{
margin-top:0;
}

input,select,button{
padding:12px;
border:none;
border-radius:10px;
margin:6px 0;
font-size:14px;
}

input,select{
background:#334155;
color:#fff;
width:100%;
outline:none;
}

input::placeholder{
color:#cbd5e1;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
align-items:end;
}

.button-row{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:10px;
}

button{
background:#22c55e;
color:#fff;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

button:hover{
transform:translateY(-1px);
opacity:.95;
}

button.secondary{
background:#f97316;
}

button.logout{
background:#ef4444;
}

table{
width:100%;
border-collapse:collapse;
margin-top:16px;
overflow:hidden;
border-radius:12px;
}

th{
background:#f97316;
padding:12px;
text-align:center;
}

td{
background:#334155;
padding:12px;
text-align:center;
border-top:1px solid rgba(255,255,255,.06);
}

.loginBox{
max-width:420px;
margin:60px auto 0 auto;
}

.hidden{
display:none;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
flex-wrap:wrap;
margin-bottom:12px;
}

.badge{
background:#0f172a;
padding:10px 14px;
border-radius:999px;
font-size:14px;
border:1px solid rgba(255,255,255,.08);
}

.status{
margin-top:10px;
font-size:14px;
color:#cbd5e1;
}

.empty{
text-align:center;
padding:18px;
color:#cbd5e1;
}
</style>
</head>
<body>

<header>GESTIONE PRESENZE LAVORO</header>

<div class="container">

<div id="loginBox" class="card loginBox">
<h2>Accesso</h2>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<div class="button-row">
<button onclick="login()">Login</button>
<button class="secondary" onclick="register()">Registrati</button>
</div>

<div class="status" id="authStatus"></div>
</div>

<div id="app" class="hidden">

<div class="topbar">
<div class="badge" id="userInfo">Utente: -</div>
<button class="logout" onclick="logout()">Logout</button>
</div>

<div class="card">
<h3>Inserisci Presenza</h3>

<div class="form-grid">
<input id="nome" placeholder="Nome">
<input id="data" type="date">
<select id="stato">
<option value="Presente">Presente</option>
<option value="Assente">Assente</option>
<option value="Ferie">Ferie</option>
<option value="Permesso">Permesso</option>
</select>
<input id="ore" type="number" step="0.5" min="0" placeholder="Ore">
<input id="sede" placeholder="Sede">
<input id="note" placeholder="Note">
</div>

<div class="button-row">
<button onclick="addPresenza()">Salva</button>
</div>

<div class="status" id="appStatus"></div>
</div>

<div class="card">
<h3>Presenze</h3>

<table>
<thead>
<tr>
<th>Nome</th>
<th>Data</th>
<th>Stato</th>
<th>Ore</th>
<th>Sede</th>
<th>Note</th>
</tr>
</thead>
<tbody id="tabella"></tbody>
</table>
</div>

</div>

</div>

<script>
const SUPABASE_URL = "https://nzmgjuwmrvjxpykzawkp.supabase.co"
const SUPABASE_KEY = "sb_publishable_lwd5Lahd5CirK_RlQmhcBA_PTo6c14v"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

let user = null

function setAuthStatus(msg){
document.getElementById("authStatus").textContent = msg || ""
}

function setAppStatus(msg){
document.getElementById("appStatus").textContent = msg || ""
}

function showApp(currentUser){
user = currentUser
document.getElementById("loginBox").classList.add("hidden")
document.getElementById("app").classList.remove("hidden")
document.getElementById("userInfo").textContent = `Utente: ${user.email}`
loadPresenze()
}

function showLogin(){
user = null
document.getElementById("app").classList.add("hidden")
document.getElementById("loginBox").classList.remove("hidden")
document.getElementById("userInfo").textContent = "Utente: -"
document.getElementById("tabella").innerHTML = ""
}

async function checkSession(){
const { data, error } = await supabase.auth.getSession()

if(error){
showLogin()
return
}

const currentUser = data?.session?.user || null

if(currentUser){
showApp(currentUser)
}else{
showLogin()
}
}

async function login(){
const email = document.getElementById("email").value.trim()
const password = document.getElementById("password").value.trim()

setAuthStatus("")

if(!email || !password){
setAuthStatus("Inserisci email e password")
return
}

const { data, error } = await supabase.auth.signInWithPassword({
email,
password
})

if(error){
setAuthStatus("Errore login: " + error.message)
return
}

showApp(data.user)
}

async function register(){
const email = document.getElementById("email").value.trim()
const password = document.getElementById("password").value.trim()

setAuthStatus("")

if(!email || !password){
setAuthStatus("Inserisci email e password")
return
}

const { error } = await supabase.auth.signUp({
email,
password
})

if(error){
setAuthStatus("Errore registrazione: " + error.message)
return
}

setAuthStatus("Registrazione completata. Ora fai login.")
}

async function logout(){
await supabase.auth.signOut()
showLogin()
setAuthStatus("Logout effettuato")
}

async function addPresenza(){
setAppStatus("")

if(!user){
setAppStatus("Devi fare login")
return
}

const nome = document.getElementById("nome").value.trim()
const data = document.getElementById("data").value
const stato = document.getElementById("stato").value
const ore = document.getElementById("ore").value || 0
const sede = document.getElementById("sede").value.trim()
const note = document.getElementById("note").value.trim()

if(!nome || !data){
setAppStatus("Compila almeno nome e data")
return
}

const { error } = await supabase
.from("presenze")
.insert([{
user_id: user.id,
email: user.email,
nome,
data,
stato,
ore,
sede,
note
}])

if(error){
setAppStatus("Errore inserimento: " + error.message)
return
}

document.getElementById("nome").value = ""
document.getElementById("data").value = ""
document.getElementById("stato").value = "Presente"
document.getElementById("ore").value = ""
document.getElementById("sede").value = ""
document.getElementById("note").value = ""

setAppStatus("Presenza salvata")
loadPresenze()
}

async function loadPresenze(){
if(!user) return

const { data, error } = await supabase
.from("presenze")
.select("*")
.order("data", { ascending:false })

const tabella = document.getElementById("tabella")
tabella.innerHTML = ""

if(error){
tabella.innerHTML = `<tr><td colspan="6" class="empty">Errore caricamento: ${error.message}</td></tr>`
return
}

if(!data || data.length === 0){
tabella.innerHTML = `<tr><td colspan="6" class="empty">Nessuna presenza trovata</td></tr>`
return
}

data.forEach(r => {
tabella.innerHTML += `
<tr>
<td>${r.nome || ""}</td>
<td>${r.data || ""}</td>
<td>${r.stato || ""}</td>
<td>${r.ore || 0}</td>
<td>${r.sede || ""}</td>
<td>${r.note || ""}</td>
</tr>
`
})
}

supabase.auth.onAuthStateChange((_event, session) => {
if(session?.user){
showApp(session.user)
}else{
showLogin()
}
})

checkSession()
</script>

</body>
</html>
